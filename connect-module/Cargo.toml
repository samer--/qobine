[lints]
workspace = true

[package]
name = "connect-module"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "qobine-connect"
path = "src/main.rs"

[features]
gpio = ["gpio-module/gpio"]

[dependencies]
controls-module = { version = "*", path = "../controls-module" }
player-module = { version = "*", path = "../player-module" }
gpio-module = { version = "*", path = "../gpio-module", optional = true }
cli-module = { version = "*", path = "../cli-module" }
qconnect-protocol = { path = "../qconnect-protocol" }
qconnect-transport-ws = { path = "../qconnect-transport-ws" }

tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

# binary dependencies
clap.workspace = true
tracing-subscriber.workspace = true
